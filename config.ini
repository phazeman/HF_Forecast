# HF Propagation Forecast Generator - Configuration File
# --------------------------------------------------------
# Note: After manual editing, restart the application for changes to take effect.

[STATION]
# Your 4 or 6 character Maidenhead Locator (e.g., KM72KH, FN20, etc.)
origin_grid = KM72KH

# Transmitter power in Watts. Recommended range: 1 to 1500
power = 100

# Type of antenna used for Transmitting. 
# Options: Yagi, Hexbeam, Dipole, Vertical, Wire
tx_antenna = Yagi

# Type of antenna used for Receiving. 
# Options: Yagi, Hexbeam, Dipole, Vertical, Wire
rx_antenna = Yagi

# Local RF noise environment. Affects the Signal-to-Noise simulation.
# Options: Rural (Lowest noise), Suburban, Urban (Highest noise)
location_type = Urban

[PREFERENCES]
# The visual appearance of the desktop GUI. 
# Options: Dark, Light, System (Follows Windows/OS setting)
theme = Light

# Bands to be checked by default in the UI. 
# Options: 160m, 80m, 40m, 30m, 20m, 17m, 15m, 12m, 10m, 6m
active_bands = 10m, 12m, 15m, 17m, 20m, 40m

# Operating modes to be checked by default. 
# Options: SSB, CW, WSPR, FT8, FT4, RTTY
active_modes = SSB, FT8